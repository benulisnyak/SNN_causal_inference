[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-connectivity-inference"
version = "1.0.0"
description = "Spiking-neural-network activity matching and gradient-boosted structural connectivity inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Benjamin A. Ulisnyak"}]
keywords = [
    "machine learning",
    "computational neuroscience",
    "spiking neural networks",
    "connectivity inference",
    "gradient boosting",
    "network science",
]
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
training = ["torch>=2.0"]
dev = ["pre-commit>=3.7", "pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/benulisnyak/SNN_causal_inference"

[project.scripts]
snn-connectivity = "snn_connectivity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
